<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="download.png"/>
    <title>Pokemon (GBA) - Project School Stash</title>
    <audio id="myAudio" autoplay loop>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
      <script>
        document.addEventListener('DOMContentLoaded', function() {
          var audio = document.getElementById('myAudio');
          audio.muted = true; // Mute the audio to bypass autoplay restriction
          audio.play().then(function() {
            audio.muted = false; // Unmute after playing
          }).catch(function(error) {
            console.log('Playback failed:', error);
          });
        });
      </script>
</head>
<body>
    <header>
        <div style="text-align: center;">
          <p><a href="https://www.youtube.com/watch?v=Z94qhglcPcA">Song Playing: Pokémon Let's Go's Viridian Forest</a></p>
          <h1>Pokémon Games</h1>
            <button onclick="window.location.href='ruby'">Pokémon Ruby</button>
            <button onclick="window.location.href='sapphire'">Pokémon Sapphire</button>
            <button onclick="window.location.href='emerald'">Pokémon Emerald</button><br><p>-----</p>
            <button onclick="window.location.href='firered'">Pokémon Fire Red</button>
            <button onclick="window.location.href='leafgreen'">Pokémon Leaf Green</button><br><p>-----</p>
            <button onclick="window.location.href='pinball'">Pokémon Pinball</button><br>----------<br>
          <button onclick="window.location.href='rom';">Pokémon ROM Hacks</button>
    </header>
    <footer>
        <div style="text-align: center;">
          <p>_____________</p>
          <button onclick="window.location.href='/project-school-stash/';">Return to Home</button>
        </div>
    </footer>
</body>
</html>

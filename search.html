<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - Project School Stash</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }
        .nav-buttons {
            margin-bottom: 20px;
        }
        .nav-buttons button {
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 8px;
        }
        .game-item {
            margin-bottom: 10px;
        }
        .game-item a {
            font-size: 1.2em;
            text-decoration: none;
            color: #007bff;
        }
        .game-item a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="nav-buttons">
        <button onclick="window.location.href='index.html';">← Back to Home</button>
    </div>
    <h2 id="page-heading">Search Results for: <span id="search-term"></span></h2>
    <div id="results-container">Loading...</div>
    <hr style="margin-top: 2rem;">
    <p>
        Game not found? Try a different search term, or 
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfXxIjYVfGeXXO2MgF-rW1nIXFu0v2iag_2ZWf9GTm0b-7tUw" target="_blank">submit a form to get it added</a>.
    </p>

<script>
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        const showAll = urlParams.get('all') === 'true';
        const forceSearch = urlParams.get('force') === 'true';
        
        const pageHeading = document.getElementById('page-heading');
        const resultsContainer = document.getElementById('results-container');

        const broadSearchTerms = ["pokemon", "tetris", "bloons", "learn to fly"];
        const cleanQuery = query ? query.trim().toLowerCase() : '';
        const isBroadTerm = !forceSearch && broadSearchTerms.includes(cleanQuery);

        if (showAll) {
            pageHeading.textContent = 'All Available Games';
            fetch('directory.json')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    if (!data || data.length === 0) {
                        resultsContainer.innerHTML = '<p>No games found in directory.</p>';
                        return;
                    }

                    const sortedGames = [...data].sort((a, b) => a.name.localeCompare(b.name));
                    resultsContainer.innerHTML = `<p style="color: #555;">Showing all ${sortedGames.length} games:</p>`;

                    sortedGames.forEach(game => {
                        resultsContainer.innerHTML += `
                            <div class="game-item">
                                <a href="https://inkin6779.github.io/project-school-stash/${game.path}">${game.name}</a>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    console.error("Error loading directory:", err);
                    resultsContainer.innerHTML = '<p>Error loading game directory.</p>';
                });

        } else if (!query) {
            document.getElementById('search-term').textContent = 'Nothing';
            resultsContainer.innerHTML = '<p>Please enter a search term.</p>';
        } else if (isBroadTerm) {
            document.getElementById('search-term').textContent = query;
            const forceUrl = `?q=${encodeURIComponent(query)}&force=true`;
            resultsContainer.innerHTML = `<p>This search is too broad, try being more specific or <a href="${forceUrl}">search anyway</a>.</p>`;

        } else {
            document.getElementById('search-term').textContent = query;
            fetch('directory.json')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    const options = {
                        includeScore: true,
                        threshold: 0.4, 
                        keys: ['name', 'slug']
                    };
                    
                    const fuse = new Fuse(data, options);
                    const results = fuse.search(query);

                    if (results.length === 0) {
                        resultsContainer.innerHTML = '<p>No matching games found.</p>';
                        return;
                    }

                    // Warn if too many results return (unless user clicked "search anyway")
                    if (!forceSearch && results.length > 10) {
                        const forceUrl = `?q=${encodeURIComponent(query)}&force=true`;
                        resultsContainer.innerHTML = `<p>Too many matches (${results.length} games found). Try being more specific or <a href="${forceUrl}">search anyway</a>.</p>`;
                        return;
                    }

                    // Redirect immediately if a single exact match is found
                    if (results.length === 1 && results[0].score <= 0.01) {
                        window.location.href = `https://inkin6779.github.io/project-school-stash/${results[0].item.path}`;
                        return;
                    }

                    resultsContainer.innerHTML = ''; 

                    results.forEach(result => {
                        const matchPercentage = Math.round((1 - result.score) * 100);
                        const game = result.item;
                        
                        resultsContainer.innerHTML += `
                            <div class="game-item">
                                <a href="https://inkin6779.github.io/project-school-stash/${game.path}">
                                    ${game.name}
                                </a>
                                <span style="color: #555; font-size: 0.9em; margin-left: 10px;">
                                    (${matchPercentage}% match)
                                </span>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    console.error("Error loading directory:", err);
                    resultsContainer.innerHTML = '<p>Error loading game directory.</p>';
                });
        }
    </script>
</body>
</html>

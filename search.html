<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Search Results</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
</head>
<body>

    <h2>Search Results for: <span id="search-term"></span></h2>
    <div id="results-container">Loading...</div>

    <hr style="margin-top: 2rem;">
    <p>
        Game not found? Try a different search term, or 
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfXxIjYVfGeXXO2MgF-rW1nIXFu0v2iag_2ZWf9GTm0b-7tUw" target="_blank">submit a form to get it added</a>.
    </p>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const rawQuery = urlParams.get('q');
        const query = rawQuery ? rawQuery.trim() : '';
        const forceSearch = urlParams.get('force') === 'true';
        
        document.getElementById('search-term').textContent = query ? query : 'Please enter a search term.';
        const resultsContainer = document.getElementById('results-container');

        // Store broad terms in lowercase for case-insensitive matching
        const broadSearchTerms = ["pokemon", "tetris", "bloons", "learn to fly"];
        
        // Check if the query is too broad (unless the user clicked "search anyway")
        const isBroadSearch = query && !forceSearch && broadSearchTerms.some(term => 
            query.toLowerCase() === term || query.toLowerCase().includes(term)
        );

        function runSearch() {
            fetch('directory.json')
                .then(response => response.json())
                .then(data => {
                    // 1. Check for an EXACT match first (case-insensitive)
                    const exactMatch = data.find(game => game.name.toLowerCase() === query.toLowerCase());
                    
                    if (exactMatch) {
                        // Immediately redirect to the exact match page
                        window.location.href = `${exactMatch.path}/index.html`;
                        return;
                    }

                    // 2. Otherwise, run fuzzy search with Fuse.js
                    const options = {
                        includeScore: true,
                        threshold: 0.4, 
                        keys: ['name']
                    };
                    
                    const fuse = new Fuse(data, options);
                    const results = fuse.search(query);

                    if (results.length === 0) {
                        resultsContainer.innerHTML = '<p>No matching games found.</p>';
                        return;
                    }

                    resultsContainer.innerHTML = ''; 

                    results.forEach(result => {
                        const matchPercentage = Math.round((1 - result.score) * 100);
                        const game = result.item;
                        
                        // 3. Added target="_blank" and rel="noopener noreferrer" to open in a new tab
                        resultsContainer.innerHTML += `
                            <div style="margin-bottom: 10px;">
                                <a href="${game.path}/index.html" target="_blank" rel="noopener noreferrer" style="font-size: 1.2em; text-decoration: none;">
                                    ${game.name}
                                </a>
                                <span style="color: #555; font-size: 0.9em; margin-left: 10px;">
                                    (${matchPercentage}% match)
                                </span>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    console.error("Error loading directory:", err);
                    resultsContainer.innerHTML = '<p>Error loading game directory.</p>';
                });
        }

        // Main execution flow
        if (!query) {
            resultsContainer.innerHTML = '<p>Please enter a search term.</p>';
        } else if (isBroadSearch) {
            // Build a link that reloads the page with &force=true to bypass the broad check
            const forceUrl = new URL(window.location.href);
            forceUrl.searchParams.set('force', 'true');
            
            resultsContainer.innerHTML = `
                <p>This search is too broad, try being more specific or 
                <a href="${forceUrl.toString()}">search anyway</a>.</p>
            `;
        } else {
            runSearch();
        }
    </script>
</body>
</html>

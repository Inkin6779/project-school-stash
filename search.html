<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - Project School Stash</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }
        .nav-buttons {
            margin-bottom: 20px;
        }
        .nav-buttons button {
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 8px;
        }
        .game-item {
            margin-bottom: 10px;
        }
        .game-item a {
            font-size: 1.2em;
            text-decoration: none;
            color: #007bff;
        }
        .game-item a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="nav-buttons">
        <button onclick="window.location.href='index.html';">← Back to Home</button>
    </div>
    <h2 id="page-heading">Search Results for: <span id="search-term"></span></h2>
    <div id="results-container">Loading...</div>
    <hr style="margin-top: 2rem;">
    <p>
        Game not found? Try a different search term, or 
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfXxIjYVfGeXXO2MgF-rW1nIXFu0v2iag_2ZWf9GTm0b-7tUw" target="_blank">submit a form to get it added</a>.
    </p>

<script>
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        const showAll = urlParams.get('all') === 'true';
        const forceSearch = urlParams.get('force') === 'true';
        
        const pageHeading = document.getElementById('page-heading');
        const resultsContainer = document.getElementById('results-container');

        const broadSearchTerms = ["pokemon", "tetris", "bloons", "learn to fly"];
        const cleanQuery = query ? query.trim().toLowerCase() : '';
        const isBroadTerm = !forceSearch && broadSearchTerms.includes(cleanQuery);

        if (showAll) {
            pageHeading.textContent = 'All Available Games';
            fetch('directory.json')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    if (!data || data.length === 0) {
                        resultsContainer.innerHTML = '<p>No games found in directory.</p>';
                        return;
                    }

                    const sortedGames = [...data].sort((a, b) => a.name.localeCompare(b.name));
                    resultsContainer.innerHTML = `<p style="color: #555;">Showing all ${sortedGames.length} games:</p>`;

                    sortedGames.forEach(game => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'game-item';

                        const link = document.createElement('a');
                        link.href = `https://inkin6779.github.io/project-school-stash/${game.path}`;
                        link.textContent = game.name;

                        itemDiv.appendChild(link);
                        resultsContainer.appendChild(itemDiv);
                    });
                })
                .catch(err => {
                    console.error("Error loading directory:", err);
                    resultsContainer.innerHTML = '<p>Error loading game directory.</p>';
                });

        } else if (!query) {
            document.getElementById('search-term').textContent = 'Nothing';
            resultsContainer.innerHTML = '<p>Please enter a search term.</p>';
        } else if (isBroadTerm) {
            document.getElementById('search-term').textContent = query;
            const forceUrl = `?q=${encodeURIComponent(query)}&force=true`;
            resultsContainer.innerHTML = `<p>This search is too broad, try being more specific or <a href="${forceUrl}">search anyway</a>.</p>`;

        } else {
            document.getElementById('search-term').textContent = query;
            fetch('directory.json')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    const options = {
                        includeScore: true,
                        threshold: 0.2, 
                        distance: 100,
                        keys: ['name', 'slug']
                    };
                    
                    const fuse = new Fuse(data, options);
                    const results = fuse.search(query);

                    if (results.length === 0) {
                        resultsContainer.innerHTML = '<p>No matching games found.</p>';
                        return;
                    }

                    // Apply a length penalty to the score for items that have extra trailing words
                    results.forEach(res => {
                        const extraChars = res.item.name.length - cleanQuery.length;
                        if (extraChars > 0) {
                            res.score += extraChars * 0.03; 
                        }
                    });

                    // Re-sort results after applying the penalty
                    results.sort((a, b) => a.score - b.score);

                    // Warn if too many results return (unless user clicked "search anyway")
                    if (!forceSearch && results.length > 10) {
                        const forceUrl = `?q=${encodeURIComponent(query)}&force=true`;
                        resultsContainer.innerHTML = `<p>Too many matches (${results.length} games found). Try being more specific or <a href="${forceUrl}">search anyway</a>.</p>`;
                        return;
                    }

                    resultsContainer.innerHTML = ''; 

                    // Check if top result is a near-perfect match to show the non-blocking countdown banner
                    const isPerfectMatch = results[0].score <= 0.05;
                    let countdownInterval = null;

                    if (isPerfectMatch) {
                        const targetPath = `https://inkin6779.github.io/project-school-stash/${results[0].item.path}`;
                        const gameName = results[0].item.name;
                        let timeLeft = 3.5;

                        const bannerDiv = document.createElement('div');
                        bannerDiv.style.cssText = "background: #f8f9fa; border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 4px;";
                        bannerDiv.innerHTML = `
                            <p style="font-size: 1.1em; color: #333; margin: 0 0 8px 0;">
                                <strong>${gameName}</strong> found. Opening in <span id="countdown-timer">${timeLeft.toFixed(1)}</span>s... 
                                <button id="cancel-redirect" style="margin-left: 10px; font-size: 0.85em; cursor: pointer; padding: 3px 8px;">Stay Here</button>
                            </p>
                        `;
                        resultsContainer.appendChild(bannerDiv);

                        const timerSpan = document.getElementById('countdown-timer');
                        const cancelBtn = document.getElementById('cancel-redirect');

                        countdownInterval = setInterval(() => {
                            timeLeft -= 0.1;
                            if (timeLeft <= 0) {
                                clearInterval(countdownInterval);
                                window.location.href = targetPath;
                            } else {
                                timerSpan.textContent = timeLeft.toFixed(1);
                            }
                        }, 100);

                        // Allow users to cancel the auto-redirect if they stay on the page
                        cancelBtn.addEventListener('click', () => {
                            clearInterval(countdownInterval);
                            bannerDiv.remove();
                        });
                    }

                    // Render the full list of search results underneath so they can see everything
                    results.forEach(result => {
                        const effectiveScore = Math.min(result.score, 1);
                        const matchPercentage = Math.round((1 - effectiveScore) * 100);
                        const game = result.item;
                        
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'game-item';

                        const link = document.createElement('a');
                        link.href = `https://inkin6779.github.io/project-school-stash/${game.path}`;
                        link.textContent = game.name;
                        
                        // If they click a result manually, make sure to stop the auto-redirect timer
                        link.addEventListener('click', () => {
                            if (countdownInterval) clearInterval(countdownInterval);
                        });

                        const span = document.createElement('span');
                        span.style.color = '#555';
                        span.style.fontSize = '0.9em';
                        span.style.marginLeft = '10px';
                        span.textContent = `(${matchPercentage}% match)`;

                        itemDiv.appendChild(link);
                        itemDiv.appendChild(span);
                        resultsContainer.appendChild(itemDiv);
                    });
                })
                .catch(err => {
                    console.error("Error loading directory:", err);
                    resultsContainer.innerHTML = '<p>Error loading game directory.</p>';
                });
        }
    </script>
</body>
</html>

name: Auto-Generate Folder Directory
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Scan Directories and Generate JSON
        run: |
          echo "[" > directory.json
          
          first=true
          
          # Target only subdirectories inside all-games/
          while read -r dir; do
            dir_name="${dir#./}"
            
            # Skip structural/system workspace folders
            [ "$dir_name" = "." ] && continue
            [ "$dir_name" = "all-games" ] && continue
            
            folder_slug=$(basename "$dir_name")

            # CRITICAL FILTER: Only process the folder if BOTH index.html AND a .title file exist
            if [ -f "$dir/index.html" ] && [ -f "$dir/.title" ]; then
              
              # Read the clean name directly from the .title file
              clean_name=$(head -n 1 "$dir/.title" | xargs)
              
              if [ "$first" = true ]; then
                first=false
              else
                echo "," >> directory.json
              fi
              
              echo "  {\"name\": \"$clean_name\", \"path\": \"$dir_name\", \"slug\": \"$folder_slug\"}" >> directory.json
            fi
          done < <(find ./all-games -type d ! -path '*/.*' ! -name 'node_modules' 2>/dev/null || find . -type d ! -path '*/.*' ! -name 'node_modules')
          
          echo "]" >> directory.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add directory.json
          git diff-index --quiet HEAD || (git commit -m "chore: updated folder tracking matrix [skip ci]" && git push origin main)
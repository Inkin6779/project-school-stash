name: Auto-Generate Folder Directory
on:
  push:
    branches:
      - main  # Runs whenever you update your code

# THIS BLOCK FIXES THE EXIT CODE 128 PERMISSION ERROR
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main # Fixes detached HEAD states during pushes

      - name: Scan Directories and Generate JSON
        run: |
          echo "[" > directory.json
          first=true
          # Use find to locate all directories and check for index.html files
          find . -type d ! -name ".git" ! -name "node_modules" | while read dir; do
            dir_name="${dir#./}"  # Remove leading './'
            if [ -f "$dir/index.html" ]; then
              has_index="true"
            else
              has_index="false"
            fi
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> directory.json
            fi
            echo "  {\"name\": \"$dir_name\", \"hasPage\": $has_index}" >> directory.json
          done
          echo "]" >> directory.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add directory.json
          git diff-index --quiet HEAD || (git commit -m "chore: updated folder tracking matrix [skip ci]" && git push origin main)
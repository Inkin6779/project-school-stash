name: Auto-Generate Folder Directory
on:
  push:
    branches:
      - product
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: product

      - name: Scan GitHub Repos and Generate JSON
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USER: "Inkin6779"
          REPO_PREFIX: "pss"
        run: |
          python3 - << 'EOF'
          import os
          import json
          import urllib.request
          import urllib.error

          token = os.environ.get("GH_TOKEN")
          user = os.environ["GITHUB_USER"]
          prefix = os.environ["REPO_PREFIX"]

          headers = {
              "Accept": "application/vnd.github.v3+json",
              "User-Agent": "GitHub-Actions-Directory-Generator"
          }
          if token:
              headers["Authorization"] = f"token {token}"

          def fetch_url(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.read().decode("utf-8")
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return None
                  raise

          # 1. Fetch all repositories for the user (handles pagination)
          repos = []
          page = 1
          while True:
              # Uses /user/repos if token is provided (includes private repos), otherwise /users/{user}/repos
              endpoint = f"https://api.github.com/user/repos?per_page=100&page={page}" if token else f"https://api.github.com/users/{user}/repos?per_page=100&page={page}"
              data = fetch_url(endpoint)
              if not data:
                  break
              batch = json.loads(data)
              if not batch:
                  break
              repos.extend(batch)
              page += 1

          directory = []

          for repo in repos:
              repo_name = repo["name"]
              owner = repo["owner"]["login"]
              default_branch = repo["default_branch"]

              # Filter by owner and "pss" prefix
              if owner.lower() != user.lower() or not repo_name.startswith(prefix):
                  continue

              # 2. Check for .info file in the root of the repository
              info_url = f"https://raw.githubusercontent.com/{owner}/{repo_name}/{default_branch}/.info"
              info_content = fetch_url(info_url)

              if not info_content:
                  continue

              # Optional: Keep the index.html requirement from your original script
              index_url = f"https://raw.githubusercontent.com/{owner}/{repo_name}/{default_branch}/index.html"
              if fetch_url(index_url) is None:
                  continue

              # 3. Dynamically parse all key = "value" pairs from .info
              entry = {
                  "slug": repo_name,
                  "repo_url": repo["html_url"]
              }

              for line in info_content.splitlines():
                  line = line.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, val = line.split("=", 1)
                  key = key.strip()
                  val = val.strip().strip('"').strip("'")
                  entry[key] = val

              # Fallback if 'name' is needed alongside 'title'
              if "title" in entry and "name" not in entry:
                  entry["name"] = entry["title"]

              directory.append(entry)

          # Sort alphabetically by title/slug
          directory.sort(key=lambda x: x.get("title", x["slug"]).lower())

          with open("directory.json", "w", encoding="utf-8") as f:
              json.dump(directory, f, indent=2)

          print(f"Successfully indexed {len(directory)} repositories.")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add directory.json
          git diff-index --quiet HEAD || (git commit -m "chore: updated folder tracking matrix" && git push origin product)
name: Auto-Generate Folder Directory
on:
  push:
    branches:
      - main  # Runs whenever you update your code

# THIS BLOCK FIXES THE EXIT CODE 128 PERMISSION ERROR
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main # Fixes detached HEAD states during pushes

      - name: Scan Directories and Generate JSON
        run: |
          echo "[" > directory.json
          
          # Use a process substitution loop to keep variables alive in the main shell
          first=true
          while read -r dir; do
            dir_name="${dir#./}"  # Remove leading './'
            
            # Skip the root workspace directory if it returns '.'
            [ "$dir_name" = "." ] && continue
            
            # Only index folders that contain an index.html file (real game targets)
            if [ -f "$dir/index.html" ]; then
              
              # Isolate the final slug (e.g., extracts "learn-to-fly" from "flash/learn-to-fly")
              folder_slug=$(basename "$dir_name")
              
              # FIXED: Changed lower() to tolower() so awk processes the strings correctly
              clean_name=$(echo "$folder_slug" | sed -E 's/[-_]+/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) tolower(substr($i,2))}1')
              
              if [ "$first" = true ]; then
                first=false
              else
                echo "," >> directory.json
              fi
              
              # Store both the beautiful clean name and the exact file system path
              echo "  {\"name\": \"$clean_name\", \"path\": \"$dir_name\", \"slug\": \"$folder_slug\"}" >> directory.json
            fi
          done < <(find . -type d ! -path '*/.*' ! -name 'node_modules')
          
          echo "]" >> directory.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add directory.json
          git diff-index --quiet HEAD || (git commit -m "chore: updated folder tracking matrix [skip ci]" && git push origin main)